name: Check Wizard
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned Luau and Rojo tools
        run: |
          mkdir -p /tmp/wizard-tools/luau /tmp/wizard-tools/rojo
          curl --fail --location https://github.com/luau-lang/luau/releases/download/0.743/luau-ubuntu.zip -o /tmp/wizard-tools/luau.zip
          echo '99d45afb4afaee00ba631c526c8e8c76c67b60f6f119953ce6409be6d6953663  /tmp/wizard-tools/luau.zip' | sha256sum --check
          curl --fail --location https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o /tmp/wizard-tools/rojo.zip
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  /tmp/wizard-tools/rojo.zip' | sha256sum --check
          unzip /tmp/wizard-tools/luau.zip -d /tmp/wizard-tools/luau
          unzip /tmp/wizard-tools/rojo.zip -d /tmp/wizard-tools/rojo
          chmod +x /tmp/wizard-tools/luau/* /tmp/wizard-tools/rojo/rojo
          echo '/tmp/wizard-tools/luau' >> "$GITHUB_PATH"
          echo '/tmp/wizard-tools/rojo' >> "$GITHUB_PATH"
      - name: Verify committed Studio file and test game
        run: python3 tools/check.py
      - name: Rebuild Studio file and verify
        run: |
          rojo build default.project.json -o Wizard.rbxlx
          python3 tools/check.py --place-only
      - uses: actions/upload-artifact@v4
        with:
          name: Wizard-Roblox-Studio
          path: Wizard.rbxlx
